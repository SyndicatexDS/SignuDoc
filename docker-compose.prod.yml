services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: blueprint
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blueprint_secure_pass_2026}
      POSTGRES_DB: blueprint
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueprint -d blueprint"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    volumes:
      - storage_data:/app/data/storage

volumes:
  pgdata:
  storage_data:
